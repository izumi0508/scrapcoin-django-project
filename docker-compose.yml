services:

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: scrapcoin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

  web:
    build: .

    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db