{% extends "base.html" %}

{% block title %}Crypto Market{% endblock %}

{% block extra_css %}
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #131722;
        color: #d1d4dc;
        font-family: Arial, sans-serif;
    }

    .app {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* 左側幣種清單 */
    .sidebar {
        width: 280px;
        min-width: 280px;
        background: #1e222d;
        border-right: 1px solid #2a2e39;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        font-size: 20px;
        font-weight: bold;
        border-bottom: 1px solid #2a2e39;
    }

    .coin-list {
        overflow-y: auto;
    }

    .coin-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 18px;
        cursor: pointer;
        border-bottom: 1px solid #2a2e39;
    }

    .coin-item:hover {
        background: #2a2e39;
    }

    .coin-item.active {
        background: #2a2e39;
        border-left: 3px solid #2962ff;
    }

    .coin-symbol {
        font-weight: bold;
        font-size: 14px;
    }

    .coin-price {
        font-size: 13px;
        text-align: right;
        margin-top: 5px;
    }

    .coin-change {
        font-size: 13px;
        text-align: right;
        margin-top: 5px;
    }

    .positive {
        color: #26a69a;
    }

    .negative {
        color: #ef5350;
    }

    /* 右側主畫面 */
    .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        height: 65px;
        min-height: 65px;
        padding: 20px;
        border-bottom: 1px solid #2a2e39;
        display: flex;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
    }

    .chart-container {
        flex: 1;
        min-height: 0;
        padding: 15px;
    }

    #chart {
        width: 100%;
        height: 100%;
    }

    .status {
        padding: 15px;
        color: #787b86;
        font-size: 13px;
    }

    @media (max-width: 650px) {
        .sidebar {
            width: 150px;
            min-width: 150px;
        }

        .coin-item {
            padding: 12px 8px;
        }

        .topbar {
            font-size: 16px;
        }
    }
</style>
{% endblock %}


{% block content %}

<div class="app">

    <!-- 左側幣種清單 -->
    <aside class="sidebar">

        <div class="sidebar-header">
            Cryptos
        </div>

        <div id="coin-list" class="coin-list">
            <div class="status">Loading coins...</div>
        </div>

    </aside>


    <!-- 右側 K 線圖 -->
    <main class="main">

        <div class="topbar">
            <span id="chart-title">Select a coin</span>
        </div>

        <div class="chart-container">
            <div id="chart"></div>
        </div>

    </main>

</div>

{% endblock %}


{% block extra_js %}

<!-- TradingView Lightweight Charts -->
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<script>

    const API_URL = "/api/v1/klines/";

    let allKlines = [];
    let chart = null;
    let candleSeries = null;
    let selectedSymbol = null;


    // 建立 K 線圖
    function initializeChart() {

        const chartElement = document.getElementById("chart");

        chart = LightweightCharts.createChart(chartElement, {
            width: chartElement.clientWidth,
            height: chartElement.clientHeight,

            layout: {
                background: {
                    color: "#131722"
                },
                textColor: "#d1d4dc"
            },

            grid: {
                vertLines: {
                    color: "#2a2e39"
                },
                horzLines: {
                    color: "#2a2e39"
                }
            },

            timeScale: {
                timeVisible: true,
                borderColor: "#2a2e39"
            },

            rightPriceScale: {
                borderColor: "#2a2e39"
            }
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: "#26a69a",
            downColor: "#ef5350",
            borderUpColor: "#26a69a",
            borderDownColor: "#ef5350",
            wickUpColor: "#26a69a",
            wickDownColor: "#ef5350"
        });

        // 視窗大小改變時，調整圖表尺寸
        const resizeObserver = new ResizeObserver(() => {
            chart.applyOptions({
                width: chartElement.clientWidth,
                height: chartElement.clientHeight
            });
        });

        resizeObserver.observe(chartElement);
    }


    // 取得 API 資料（支援 DRF 分頁）
    async function fetchAllKlines() {

        let url = API_URL + "?interval=1d";
        let results = [];

        while (url) {

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("API request failed: " + response.status);
            }

            const data = await response.json();

            // DRF 分頁格式：{ results: [...], next: "..." }
            if (Array.isArray(data)) {
                results = results.concat(data);
                url = null;
            } else {
                results = results.concat(data.results || []);
                url = data.next;
            }
        }

        return results;
    }


    // 整理左側幣種清單
    function renderCoinList() {

        const coinMap = {};

        allKlines.forEach(kline => {

            if (!coinMap[kline.symbol]) {
                coinMap[kline.symbol] = [];
            }

            coinMap[kline.symbol].push(kline);
        });

        const coinList = document.getElementById("coin-list");

        coinList.innerHTML = "";

        const symbols = Object.keys(coinMap).sort();

        symbols.forEach(symbol => {

            const klines = coinMap[symbol];

            // 依照時間排序，最新的放最後
            klines.sort((a, b) =>
                new Date(a.open_time) - new Date(b.open_time)
            );

            const latest = klines[klines.length - 1];
            const previous = klines[klines.length - 2];

            const price = Number(latest.close_price);

            let change = null;

            if (previous && Number(previous.close_price) !== 0) {
                change = (
                    (price - Number(previous.close_price))
                    / Number(previous.close_price)
                ) * 100;
            }

            const item = document.createElement("div");

            item.className = "coin-item";

            if (symbol === selectedSymbol) {
                item.classList.add("active");
            }

            const changeClass =
                change === null ? "" :
                change >= 0 ? "positive" : "negative";

            item.innerHTML = `
                <div>
                    <div class="coin-symbol">${symbol}</div>
                </div>

                <div>
                    <div class="coin-price">
                        ${price.toLocaleString("en-US", {
                            maximumFractionDigits: 8
                        })}
                    </div>

                    <div class="coin-change ${changeClass}">
                        ${change === null ? "--" :
                            (change >= 0 ? "+" : "") +
                            change.toFixed(2) + "%"
                        }
                    </div>
                </div>
            `;

            item.addEventListener("click", () => {
                selectCoin(symbol);
            });

            coinList.appendChild(item);
        });

        // 預設選擇第一個幣種
        if (!selectedSymbol && symbols.length > 0) {
            selectCoin(symbols[0]);
        }
    }


    // 選擇幣種並更新 K 線圖
    function selectCoin(symbol) {

        selectedSymbol = symbol;

        document.getElementById("chart-title").textContent = symbol;

        const selectedKlines = allKlines
            .filter(kline => kline.symbol === symbol)
            .sort((a, b) =>
                new Date(a.open_time) - new Date(b.open_time)
            );

        const candleData = selectedKlines.map(kline => {

            return {
                time: Math.floor(
                    new Date(kline.open_time).getTime() / 1000
                ),

                open: Number(kline.open_price),
                high: Number(kline.high_price),
                low: Number(kline.low_price),
                close: Number(kline.close_price)
            };

        });

        candleSeries.setData(candleData);

        chart.timeScale().fitContent();

        renderCoinList();
    }


    // 啟動
    async function startApp() {

        try {

            initializeChart();

            allKlines = await fetchAllKlines();

            if (allKlines.length === 0) {
                document.getElementById("coin-list").innerHTML =
                    '<div class="status">No Kline data available.</div>';

                return;
            }

            renderCoinList();

        } catch (error) {

            console.error(error);

            document.getElementById("coin-list").innerHTML =
                '<div class="status">Failed to load market data.</div>';
        }
    }


    startApp();

</script>

{% endblock %}
