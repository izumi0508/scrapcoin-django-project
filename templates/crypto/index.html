{% extends "base.html" %}

{% block title %}Crypto Market{% endblock %}

{% block extra_css %}
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #131722;
        color: #d1d4dc;
        font-family: Arial, sans-serif;
    }

    .app {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* 左側幣種清單 */
    .sidebar {
        width: 280px;
        min-width: 280px;
        background: #1e222d;
        border-right: 1px solid #2a2e39;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        font-size: 20px;
        font-weight: bold;
        border-bottom: 1px solid #2a2e39;
    }

    .coin-list {
        overflow-y: auto;
        flex: 1;
    }

    .coin-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 18px;
        cursor: pointer;
        border-bottom: 1px solid #2a2e39;
        transition: background 0.15s;
    }

    .coin-item:hover {
        background: #2a2e39;
    }

    .coin-item.active {
        background: #2a2e39;
        border-left: 3px solid #2962ff;
        padding-left: 15px;
    }

    .coin-symbol {
        font-weight: bold;
        font-size: 14px;
    }

    .coin-price {
        font-size: 13px;
        text-align: right;
        margin-top: 5px;
    }

    .coin-change {
        font-size: 13px;
        text-align: right;
        margin-top: 5px;
    }

    .positive {
        color: #26a69a;
    }

    .negative {
        color: #ef5350;
    }

    /* 右側主畫面 */
    .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        height: 65px;
        min-height: 65px;
        padding: 20px;
        border-bottom: 1px solid #2a2e39;
        display: flex;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
    }

    .chart-container {
        flex: 1;
        min-height: 0;
        padding: 15px;
    }

    #chart {
        width: 100%;
        height: 100%;
    }

    .status {
        padding: 15px;
        color: #787b86;
        font-size: 13px;
    }

    @media (max-width: 650px) {
        .sidebar {
            width: 150px;
            min-width: 150px;
        }

        .coin-item {
            padding: 12px 8px;
        }

        .coin-item.active {
            padding-left: 5px;
        }

        .topbar {
            font-size: 16px;
        }
    }
</style>
{% endblock %}


{% block content %}

<div class="app">

    <!-- 左側幣種清單 -->
    <aside class="sidebar">

        <div class="sidebar-header">
            Cryptos
        </div>

        <div id="coin-list" class="coin-list">
            <div class="status">Loading coins...</div>
        </div>

    </aside>


    <!-- 右側 K 線圖 -->
    <main class="main">

        <div class="topbar">
            <span id="chart-title">Select a coin</span>
        </div>

        <div class="chart-container">
            <div id="chart"></div>
        </div>

    </main>

</div>

{% endblock %}


{% block extra_js %}

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<script>

    // ==========================================
    // 基本設定
    // ==========================================

    const API_URL = "/api/v1/klines/";
    const INTERVAL = "1d";

    let allKlines = [];
    let coinData = {};

    let chart = null;
    let candleSeries = null;

    let selectedSymbol = null;


    // ==========================================
    // 初始化 K 線圖
    // ==========================================

    function initializeChart() {

        const chartElement = document.getElementById("chart");

        chart = LightweightCharts.createChart(chartElement, {

            width: chartElement.clientWidth,
            height: chartElement.clientHeight,

            layout: {
                background: {
                    color: "#131722"
                },
                textColor: "#d1d4dc"
            },

            grid: {
                vertLines: {
                    color: "#2a2e39"
                },
                horzLines: {
                    color: "#2a2e39"
                }
            },

            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal
            },

            timeScale: {
                timeVisible: true,
                borderColor: "#2a2e39"
            },

            rightPriceScale: {
                borderColor: "#2a2e39"
            }
        });

        candleSeries = chart.addCandlestickSeries({

            upColor: "#26a69a",
            downColor: "#ef5350",

            borderUpColor: "#26a69a",
            borderDownColor: "#ef5350",

            wickUpColor: "#26a69a",
            wickDownColor: "#ef5350"

        });


        // 自動調整圖表大小
        const resizeObserver = new ResizeObserver(() => {

            const width = chartElement.clientWidth;
            const height = chartElement.clientHeight;

            if (width > 0 && height > 0) {

                chart.applyOptions({
                    width: width,
                    height: height
                });

            }

        });

        resizeObserver.observe(chartElement);

    }


    // ==========================================
    // 取得 DRF 所有分頁資料
    // ==========================================

    async function fetchAllKlines() {

        let url = `${API_URL}?interval=${encodeURIComponent(INTERVAL)}`;

        const results = [];

        const visitedUrls = new Set();

        let page = 1;

        while (url) {

            // 防止 API next URL 意外形成循環
            if (visitedUrls.has(url)) {
                throw new Error("Pagination URL loop detected.");
            }

            visitedUrls.add(url);

            console.log(`Fetching Kline page ${page}...`);

            const response = await fetch(url);

            if (!response.ok) {

                throw new Error(
                    `API request failed: ${response.status}`
                );

            }

            const data = await response.json();

            // 相容未分頁 API
            if (Array.isArray(data)) {

                results.push(...data);
                url = null;

            } else {

                const pageResults = Array.isArray(data.results)
                    ? data.results
                    : [];

                results.push(...pageResults);

                url = data.next;

            }

            page++;

        }

        console.log("Kline loading completed:", results.length);

        return results;

    }


    // ==========================================
    // 整理及驗證 K 線資料
    // ==========================================

    function normalizeKlines(rawKlines) {

        const grouped = {};

        rawKlines.forEach(kline => {

            if (!kline || !kline.symbol || !kline.open_time) {
                return;
            }

            const timestamp = Math.floor(
                new Date(kline.open_time).getTime() / 1000
            );

            const open = Number(kline.open_price);
            const high = Number(kline.high_price);
            const low = Number(kline.low_price);
            const close = Number(kline.close_price);

            // 排除無效時間及價格
            if (!Number.isFinite(timestamp) || timestamp <= 0) {
                return;
            }

            if (
                !Number.isFinite(open) ||
                !Number.isFinite(high) ||
                !Number.isFinite(low) ||
                !Number.isFinite(close)
            ) {
                return;
            }

            // 排除不合理的 OHLC 組合
            if (
                high < low ||
                high < Math.max(open, close) ||
                low > Math.min(open, close)
            ) {
                return;
            }

            const symbol = kline.symbol;

            if (!grouped[symbol]) {
                grouped[symbol] = new Map();
            }

            // 使用 timestamp 作為 key，避免重複時間
            grouped[symbol].set(timestamp, {

                time: timestamp,
                open: open,
                high: high,
                low: low,
                close: close

            });

        });


        // 每個幣種各自依時間由舊到新排序
        const normalized = {};

        Object.keys(grouped).forEach(symbol => {

            normalized[symbol] = Array.from(
                grouped[symbol].values()
            ).sort((a, b) => a.time - b.time);

        });

        return normalized;

    }


    // ==========================================
    // 更新左側幣種清單
    // ==========================================

    function renderCoinList() {

        const coinList = document.getElementById("coin-list");

        coinList.innerHTML = "";

        const symbols = Object.keys(coinData).sort();

        if (symbols.length === 0) {

            coinList.innerHTML =
                '<div class="status">No valid Kline data available.</div>';

            return;

        }


        symbols.forEach(symbol => {

            const klines = coinData[symbol];

            if (!klines || klines.length === 0) {
                return;
            }

            const latest = klines[klines.length - 1];

            const previous = klines.length >= 2
                ? klines[klines.length - 2]
                : null;

            const price = latest.close;

            let change = null;

            if (previous && previous.close !== 0) {

                change = (
                    (latest.close - previous.close)
                    / previous.close
                ) * 100;

            }


            const item = document.createElement("div");

            item.className = "coin-item";

            if (symbol === selectedSymbol) {
                item.classList.add("active");
            }


            const left = document.createElement("div");

            const symbolElement = document.createElement("div");

            symbolElement.className = "coin-symbol";
            symbolElement.textContent = symbol;

            left.appendChild(symbolElement);


            const right = document.createElement("div");

            const priceElement = document.createElement("div");

            priceElement.className = "coin-price";

            priceElement.textContent = price.toLocaleString("en-US", {
                maximumFractionDigits: 8
            });


            const changeElement = document.createElement("div");

            changeElement.className = "coin-change";

            if (change === null) {

                changeElement.textContent = "--";

            } else {

                changeElement.textContent =
                    (change >= 0 ? "+" : "") +
                    change.toFixed(2) + "%";

                changeElement.classList.add(
                    change >= 0 ? "positive" : "negative"
                );

            }


            right.appendChild(priceElement);
            right.appendChild(changeElement);

            item.appendChild(left);
            item.appendChild(right);


            item.addEventListener("click", () => {
                selectCoin(symbol);
            });


            coinList.appendChild(item);

        });

    }


    // ==========================================
    // 選擇幣種並更新 K 線圖
    // ==========================================

    function selectCoin(symbol) {

        const selectedKlines = coinData[symbol];

        if (!selectedKlines || selectedKlines.length === 0) {
            console.warn("No Kline data for:", symbol);
            return;
        }

        selectedSymbol = symbol;

        document.getElementById("chart-title").textContent = symbol;


        // 再次確保時間順序及資料格式正確
        const candleData = selectedKlines
            .filter(kline => {

                return (
                    Number.isInteger(kline.time) &&
                    Number.isFinite(kline.open) &&
                    Number.isFinite(kline.high) &&
                    Number.isFinite(kline.low) &&
                    Number.isFinite(kline.close)
                );

            })
            .sort((a, b) => a.time - b.time);


        if (candleData.length === 0) {

            console.warn("No valid candles for:", symbol);

            candleSeries.setData([]);

            return;

        }


        // Lightweight Charts 要求 time 嚴格遞增
        candleSeries.setData(candleData);

        chart.timeScale().fitContent();

        renderCoinList();

    }


    // ==========================================
    // 啟動應用程式
    // ==========================================

    async function startApp() {

        try {

            initializeChart();

            document.getElementById("coin-list").innerHTML =
                '<div class="status">Loading market data...</div>';


            // 取得所有分頁
            allKlines = await fetchAllKlines();


            if (allKlines.length === 0) {

                document.getElementById("coin-list").innerHTML =
                    '<div class="status">No Kline data available.</div>';

                return;

            }


            // 整理資料
            coinData = normalizeKlines(allKlines);


            console.log("Raw Klines:", allKlines.length);

            console.log(
                "Valid symbols:",
                Object.keys(coinData).length
            );

            console.log(
                "Valid candles:",
                Object.values(coinData).reduce(
                    (total, klines) => total + klines.length,
                    0
                )
            );


            // 顯示幣種清單
            renderCoinList();


            // 預設選擇第一個幣種
            const symbols = Object.keys(coinData).sort();

            if (symbols.length > 0) {
                selectCoin(symbols[0]);
            }


        } catch (error) {

            console.error("Failed to start Crypto Market:", error);

            document.getElementById("coin-list").innerHTML =
                '<div class="status">Failed to load market data. Please check the API.</div>';

        }

    }


    // 啟動
    startApp();

</script>

{% endblock %}
